# Tail the shop's JSON log and ship each line to a daily OpenSearch index (logs-shop-YYYY.MM.DD).
[SERVICE]
    Flush         2
    Log_Level     info
    Parsers_File  parsers.conf

[INPUT]
    Name              tail
    Path              /logs/shop.log
    Parser            shop_json
    Read_from_Head    On
    DB                /state/tail.db
    Mem_Buf_Limit     64MB
    Buffer_Max_Size   64KB

[OUTPUT]
    Name                opensearch
    Match               *
    Host                opensearch
    Port                9200
    Logstash_Format     On
    Logstash_Prefix     logs-shop
    Logstash_DateFormat %Y.%m.%d
    Suppress_Type_Name  On
    # Hash of the record as the doc id: replaying the file can't create duplicates.
    Generate_ID         On
    Trace_Error         On
    Buffer_Size         False
    Retry_Limit         5
