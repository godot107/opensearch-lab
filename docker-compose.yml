# Local stack for the lab. Everything binds to 127.0.0.1 and the OpenSearch
# security plugin is OFF: fine on a laptop, never on a network or in AWS.
# Version is pinned to one Amazon OpenSearch Service supports, so mappings and
# queries behave the same if a lesson is later re-run on a managed domain.
services:
  opensearch:
    image: opensearchproject/opensearch:3.1.0
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports: ["127.0.0.1:9200:9200"]
    volumes: [os-data:/usr/share/opensearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      retries: 30

  dashboards:
    image: opensearchproject/opensearch-dashboards:3.1.0
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports: ["127.0.0.1:5601:5601"]
    depends_on:
      opensearch: { condition: service_healthy }

  # Source of truth. OpenSearch is a rebuildable index fed from here (oslab.sync).
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: oslab
      POSTGRES_PASSWORD: oslab
      POSTGRES_DB: oslab
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oslab"]
      interval: 5s
      retries: 20

  # Lesson 4 key-value store: AWS's official DynamoDB emulator (in-memory: data resets on restart).
  dynamodb:
    image: amazon/dynamodb-local:3.0.0
    command: -jar DynamoDBLocal.jar -inMemory -sharedDb
    ports: ["127.0.0.1:8000:8000"]

  # Lesson 2 log shipper: `docker compose --profile logs up -d fluent-bit`
  fluent-bit:
    image: fluent/fluent-bit:4.0.3
    profiles: ["logs"]
    volumes:
      - ./infra/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./infra/fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - ./logs:/logs:ro
      - fb-state:/state
    depends_on:
      opensearch: { condition: service_healthy }

volumes:
  fb-state: {}
  os-data: {}
  pg-data: {}
